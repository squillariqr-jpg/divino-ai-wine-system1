<style>
:root{--ink:#202a24;--muted:#6d756f;--paper:#f7f4ed;--card:#fffdf8;--line:#e5ded2;--red:#b64935;--green:#567565;--gold:#d99f48}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px Georgia,serif}button,input,select{font:inherit}button{cursor:pointer;border:0}.app{max-width:1180px;margin:auto;min-height:100vh;display:flex}.side{width:230px;background:#202a24;color:#eee;padding:24px 15px;display:flex;flex-direction:column;gap:22px}.logo{font-size:21px;font-weight:bold}.logo small{display:block;color:#e4af68;font:10px Arial;letter-spacing:.12em;text-transform:uppercase;margin-top:7px}.role{background:#34433a;border:1px solid #637063;color:white;border-radius:9px;padding:10px;text-align:left}.role small{display:block;color:#b4c0b3;font:10px Arial;margin-bottom:4px}.nav{display:grid;gap:5px}.nav button{background:none;color:#bdc8bc;text-align:left;border-radius:8px;padding:10px}.nav button.on,.nav button:hover{background:#e9b56b;color:#202a24}.nav b{margin-right:8px}.foot{margin-top:auto;color:#9da89c;font:11px Arial;line-height:1.5}.main{flex:1;padding:28px clamp(16px,4vw,50px);min-width:0}.mobile{display:none}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:24px}.eyebrow{font:700 10px Arial;letter-spacing:.14em;text-transform:uppercase;color:var(--red)}h1,h2,h3{margin:0}h1{font-size:40px;line-height:1.05;margin-top:7px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat,.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 10px 25px #3a29150b}.stat strong{display:block;color:var(--red);font-size:28px}.stat span,.muted{color:var(--muted);font:12px Arial}.bar{display:flex;justify-content:space-between;align-items:center;margin:25px 0 12px}.bar h2{font-size:21px}.filter{background:white;border:1px solid var(--line);padding:8px;border-radius:7px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{position:relative}.card h3{font-size:19px;margin-bottom:13px}.flag{position:absolute;right:15px;top:15px;font:700 10px Arial;color:var(--red);letter-spacing:.05em}.code{font:11px Arial;color:var(--muted);margin:4px 0 6px}.product{border-top:1px solid var(--line);padding-top:12px}.qty{margin-top:12px;line-height:1.7}.qty b{color:var(--red);font-size:18px}.meter{height:6px;background:#ece6da;border-radius:9px;margin:10px 0}.meter i{display:block;background:var(--green);height:100%;border-radius:9px}.tag{display:inline-block;padding:5px 8px;border-radius:20px;background:#e2eee3;color:#41654e;font:700 10px Arial}.tag.red{background:#fae4dc;color:#943a2c}.tag.gold{background:#f7e8c8;color:#8b5b1d}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.primary,.secondary,.danger{padding:10px 12px;border-radius:8px;font-weight:bold}.primary{background:var(--red);color:white}.secondary{background:#eee8dd;color:var(--ink)}.danger{background:#fae0d8;color:#8d3429}.notice{background:#f8e9cb;border:1px solid #ecd39f;border-radius:10px;padding:12px;margin:10px 0;line-height:1.45}.panel{margin-top:14px}.row{display:flex;justify-content:space-between;gap:15px;align-items:center;border-bottom:1px solid var(--line);padding:13px 0}.row:last-child{border:0}.row strong{display:block}.form{display:grid;gap:10px}.form label{font:11px Arial;color:var(--muted)}.form input,.form select,.form textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;background:#fff}.audit{display:grid;gap:8px}.audit div{padding:10px;border-left:3px solid var(--gold);background:#fbf7ef;font:12px Arial}.empty{text-align:center;color:var(--muted);padding:35px;border:1px dashed var(--line);border-radius:12px}.modalbg{position:fixed;inset:0;background:#182019dd;display:grid;place-items:center;padding:16px;z-index:5}.modal{background:var(--card);max-width:450px;width:100%;max-height:90vh;overflow:auto;border-radius:15px;padding:20px}.modal h2{font-size:24px;margin-bottom:8px}.modal p{line-height:1.5;color:var(--muted)}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#26352b;color:white;border-radius:9px;padding:12px 16px;z-index:9;font:13px Arial}.hidden{display:none!important}@media(max-width:720px){.app{display:block}.side{width:auto;padding:15px 16px;display:block}.logo{display:inline-block}.logo small{display:inline;margin-left:7px}.role,.nav,.foot{display:none}.mobile{display:block;float:right;background:#34433a;color:white;padding:9px;border-radius:8px}.main{padding:24px 15px 45px}.head{display:block}.head h1{font-size:33px}.stats{grid-template-columns:repeat(2,1fr)}.stat{padding:13px}.stat strong{font-size:24px}.grid{grid-template-columns:1fr}.row{align-items:flex-start;flex-direction:column}.bar{align-items:flex-start;gap:10px;flex-direction:column}}
</style></head><body>

<div class="app hidden" id="main-app"><aside class="side"><div class="logo">Rete Squillari<small>Aiuta un negozio</small></div><button class="role" id="role"><small>PROFILO DEMO</small><b id="who"></b>⌄</button><nav class="nav" id="nav"></nav><div class="foot">Solo dati dimostrativi<br>Nessuna connessione reale</div></aside><main class="main"><button class="mobile" id="mob"></button><header class="head"><div><div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1></div></header><div id="view"></div></main></div><div class="modalbg hidden" id="mb"><div class="modal" id="modal"></div></div><div id="toast" class="toast hidden"></div><script>
const KEY='rete-squillari-v2';const stores=['Responsabile centrale','2 – Malta','4 – Sestri','5 – Cantore','6 – Trento','7 – De Ferrari','8 – Armenia'];const allowed=stores.slice(1);let role=null,page='home';
// Manager authorization lives only in this closure. It is set exclusively by
// loadSession() from the validated rete_memberships row returned by Supabase;
// no other function may set it, and there is no globally reachable setter
// that accepts an arbitrary role or location value.
const RoleAuthority=(function(){let managerFlag=false;return{applyMembership(memberRole){managerFlag=(memberRole==='central')},reset(){managerFlag=false},get isManager(){return managerFlag}}})();
const seed={requests:[{id:1,store:'7 – De Ferrari',code:'2101208',name:'Erbaluce DOCG Rolletto',ordered:12,delivered:6,original:6,remaining:6,status:'DA TROVARE',urgent:true},{id:2,store:'4 – Sestri',code:'2103033',name:'Riesling Oltrepò Pavese DOC Finigeto',ordered:12,delivered:2,original:10,remaining:6,arrived:4,status:'ARRIVO PARZIALE A TRASTA',urgent:false},{id:3,store:'6 – Trento',code:'2104110',name:'Barbera d’Alba DOC',ordered:12,delivered:4,original:8,remaining:0,arrived:8,status:'ARRIVATO A TRASTA',urgent:false}],offers:[{id:1,request:1,from:'8 – Armenia',qty:4,approved:0,status:'DICHIARATA',date:'oggi'},{id:2,request:1,from:'2 – Malta',qty:2,approved:2,status:'APPROVATA',date:'oggi'},{id:3,request:2,from:'8 – Armenia',qty:3,approved:0,status:'DICHIARATA',date:'oggi'}],transfers:[{id:1,request:1,offer:2,from:'2 – Malta',to:'7 – De Ferrari',qty:2,status:'DA PREPARARE',date:'oggi'},{id:9,request:1,offer:null,from:'5 – Cantore',to:'7 – De Ferrari',qty:2,status:'IN TRASFERIMENTO',date:'ieri'}],emails:[{id:1,sender:'commerciale@enotecasquillari.it',subject:'Mancanti – 7 – De Ferrari – 2101208',date:'13/07/2026',status:'LINKED',data:'7 – De Ferrari · 2101208 · Mancante 6'},{id:2,sender:'commerciale@enotecasquillari.it',subject:'Mancanti – 4 – Sestri',date:'13/07/2026',status:'NEEDS_REVIEW',data:'Quantità mancante non interpretabile'},{id:3,sender:'commerciale@enotecasquillari.it',subject:'Mancanti – negozio?',date:'12/07/2026',status:'ERROR',data:'Negozio non riconosciuto'},{id:4,sender:'commerciale@enotecasquillari.it',subject:'Mancanti – 7 – De Ferrari – 2101208',date:'12/07/2026',status:'DUPLICATE',data:'Comunicazione già collegata'},{id:5,sender:'ordini@esempio.test',subject:'Mancanti urgenti',date:'12/07/2026',status:'ERROR',data:'Mittente non autorizzato'}],audit:[{action:'Importazione email',user:'Sistema demo',store:'—',item:'Email 1',old:'',next:'LINKED',note:''},{action:'Offerta dichiarata',user:'8 – Armenia',store:'8 – Armenia',item:'Richiesta 1',old:'',next:'4 bottiglie',note:''},{action:'Arrivo a Trasta',user:'Responsabile centrale',store:'Trasta',item:'2103033',old:'10',next:'6 residue',note:'Fonte: inserimento responsabile'}]};let db=JSON.parse(localStorage.getItem(KEY+'.db')||'null')||seed;
const storeNav=[['home','⌂','Home'],['mine','◌','Le mie richieste'],['offers','↗','Le mie offerte'],['prepare','▣','Merce da preparare'],['transfers','→','Trasferimenti'],['history','◷','Storico']];const mgrNav=[['dashboard','⌂','Dashboard'],['inbox','✉','Inbox email'],['review','✓','Verifica estrazione'],['published','▤','Richieste pubblicate'],['approve','◎','Offerte da approvare'],['arrivals','＋','Arrivi a Trasta'],['conflicts','!','Gestione conflitti'],['audit','◷','Audit log']];const manager=()=>RoleAuthority.isManager;const save=()=>localStorage.setItem(KEY+'.db',JSON.stringify(db));function log(action,item,old='',next='',note=''){db.audit.unshift({action,user:role,store:role,item,old,next,note});save()}function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.remove('hidden');setTimeout(()=>x.classList.add('hidden'),3000)}function open(html){document.getElementById('modal').innerHTML=html;document.getElementById('mb').classList.remove('hidden')}function closeModal(){document.getElementById('mb').classList.add('hidden')}
function boot(){document.getElementById('who').textContent=role;document.getElementById('mob').textContent=role+' ⌄';document.getElementById('eyebrow').textContent=manager()?'Vista responsabile':'Vista negozio';document.getElementById('title').textContent=manager()?'Controllo rete':'Dove serve una mano?';const ns=manager()?mgrNav:storeNav;document.getElementById('nav').innerHTML=ns.map(n=>`<button class="${page===n[0]?'on':''}" onclick="go('${n[0]}')"><b>${n[1]}</b>${n[2]}</button>`).join('');render()}
function go(p){page=p;boot()}function tag(s){return `<span class="tag ${s.includes('TRASTA')?'gold':s==='DA TROVARE'?'red':''}">${s}</span>`}function reqCard(r,own=false){const covered=r.original-r.remaining;return `<article class="card"><span class="flag">${r.status}</span><h3>${r.store}${own?' · MIA':''}</h3><div class="product"><div class="code">CODICE ${r.code}</div><strong>${r.name}</strong><div class="qty">${r.arrived?`Mancavano: <b>${r.original}</b><br>Arrivate a Trasta: <b>${r.arrived}</b><br>Ancora necessarie: <b>${r.remaining}</b>`:`Mancante originale: <b>${r.original}</b><br>Ancora necessarie: <b>${r.remaining}</b>`} bottiglie</div><div class="meter"><i style="width:${Math.min(100,covered/r.original*100)}%"></i></div>${tag(r.status)}</div><div class="actions">${own&&r.status!=='RITIRATA'&&canWithdraw(r)?`<button class="secondary" onclick="withdrawReq(${r.id})">Ritira richiesta</button>`:''}${!own&&r.remaining>0&&r.status!=='ARRIVATO A TRASTA'&&!manager()?`<button class="primary" onclick="offer(${r.id})">Posso aiutare</button>`:''}<button class="secondary" onclick="detail(${r.id})">Dettaglio</button></div></article>`}function canWithdraw(r){return !db.transfers.some(t=>t.request===r.id&&['DA PREPARARE','PREPARATA','IN TRASFERIMENTO'].includes(t.status))}
function render(){if(page==='home'||page==='dashboard')return home();if(page==='mine')return mine();if(page==='offers')return myOffers();if(page==='prepare')return prepare();if(page==='transfers')return transfers();if(page==='history')return history();if(page==='inbox')return inbox();if(page==='review')return review();if(page==='published')return published();if(page==='approve')return approve();if(page==='arrivals')return arrivals();if(page==='conflicts')return conflicts();if(page==='audit')return audit()}
function home(){const rs=db.requests.filter(r=>manager()||r.status!=='DA VERIFICARE');const openN=rs.filter(r=>!['CHIUSA','RITIRATA','ANNULLATA','ARRIVATO A TRASTA'].includes(r.status)).length;const urgent=rs.filter(r=>r.urgent&&r.remaining>0).length;const bottles=rs.reduce((a,r)=>a+r.remaining,0);const prep=db.transfers.filter(t=>t.from===role&&t.status==='DA PREPARARE').length;document.getElementById('view').innerHTML=`<section class="stats"><div class="stat"><strong>${openN}</strong><span>Richieste aperte</span></div><div class="stat"><strong>${urgent}</strong><span>Urgenti</span></div><div class="stat"><strong>${bottles}</strong><span>Bottiglie da trovare</span></div><div class="stat"><strong>${prep}</strong><span>Da preparare</span></div></section><div class="bar"><h2>${manager()?'Richieste della rete':'Richieste pubblicate'}</h2><select class="filter"><option>Tutte</option><option>Urgenti</option><option>Arrivi a Trasta</option></select></div><div class="grid">${rs.map(r=>reqCard(r,r.store===role)).join('')}</div>`}
function mine(){const rs=db.requests.filter(r=>r.store===role);document.getElementById('view').innerHTML=`<div class="bar"><h2>Le richieste di ${role}</h2></div><div class="grid">${rs.length?rs.map(r=>reqCard(r,true)).join(''):'<div class="empty">Nessuna richiesta associata al tuo negozio.</div>'}</div>`}function myOffers(){const os=db.offers.filter(o=>o.from===role);document.getElementById('view').innerHTML=`<div class="bar"><h2>Le mie offerte</h2></div><div class="panel">${os.length?os.map(o=>{let r=db.requests.find(x=>x.id===o.request);return `<div class="row"><div><strong>${r.store} · ${r.name}</strong><span class="muted">${o.qty} offerte · ${o.approved} approvate · ${o.date}</span></div><div>${tag(o.status)} ${o.status==='DICHIARATA'?`<button class="secondary" onclick="withdrawOffer(${o.id})">Ritira</button>`:''}</div></div>`}).join(''):'<div class="empty">Non hai ancora dichiarato disponibilità.</div>'}</div>`}function prepare(){const ts=db.transfers.filter(t=>t.from===role&&t.status==='DA PREPARARE');document.getElementById('view').innerHTML=`<div class="bar"><h2>Merce da preparare</h2></div><div class="panel">${ts.length?ts.map(t=>transferRow(t,true)).join(''):'<div class="empty">Nessuna merce approvata da preparare.</div>'}</div>`}function transfers(){const ts=db.transfers.filter(t=>t.from===role||t.to===role);document.getElementById('view').innerHTML=`<div class="bar"><h2>Trasferimenti</h2></div><div class="panel">${ts.length?ts.map(t=>transferRow(t,t.to===role)).join(''):'<div class="empty">Nessun trasferimento.</div>'}</div>`}function transferRow(t,action){const r=db.requests.find(x=>x.id===t.request);return `<div class="row"><div><strong>${t.from} → ${t.to}</strong><span class="muted">${r?.name||'Prodotto'} · ${t.qty} bottiglie · ${t.date}</span></div><div>${tag(t.status)} ${action&&t.status==='DA PREPARARE'?`<button class="secondary" onclick="setTransfer(${t.id},'PREPARATA')">Segna preparata</button>`:''}${action&&t.status==='PREPARATA'?`<button class="primary" onclick="setTransfer(${t.id},'IN TRASFERIMENTO')">Segna partita</button>`:''}${action&&t.status==='IN TRASFERIMENTO'&&t.to===role?`<button class="primary" onclick="receive(${t.id})">Conferma ricezione</button>`:''}</div></div>`}function history(){document.getElementById('view').innerHTML=`<div class="bar"><h2>Storico</h2></div><div class="panel audit">${db.audit.map(a=>`<div><b>${a.action}</b> · ${a.item}<br>${a.user} · ${a.next||'—'} <small>${a.note||''}</small></div>`).join('')}</div>`}
function inbox(){if(!manager())return denied();document.getElementById('view').innerHTML=`<div class="bar"><h2>Inbox email dimostrativa</h2></div><div class="panel">${db.emails.map(e=>`<div class="row"><div><strong>${e.subject}</strong><span class="muted">${e.sender} · ${e.date}<br>${e.data}</span></div>${tag(e.status)} ${e.status==='NEEDS_REVIEW'?`<button class="primary" onclick="go('review')">Verifica</button>`:''}</div>`).join('')}</div>`}function review(){if(!manager())return denied();const e=db.emails.find(x=>x.status==='NEEDS_REVIEW');document.getElementById('view').innerHTML=`<div class="bar"><h2>Verifica estrazione</h2></div><div class="panel form"><p class="muted">Email: ${e?.subject||'nessuna'}<br>Mittente: ${e?.sender||''}</p><label>Negozio<select id="rvstore"><option>4 – Sestri</option><option>2 – Malta</option><option>5 – Cantore</option><option>6 – Trento</option><option>7 – De Ferrari</option><option>8 – Armenia</option></select></label><label>Codice<input id="rvcode" value="2103033"></label><label>Descrizione<input id="rvname" value="Riesling Oltrepò Pavese DOC Finigeto"></label><label>Quantità ordinata<input id="rvord" type="number" value="12"></label><label>Quantità consegnata<input id="rvdel" type="number" value="2"></label><div class="actions"><button class="primary" onclick="publishReview()">Correggi e pubblica</button><button class="danger" onclick="rejectReview()">Respingi importazione</button></div></div>`}function publishReview(){let ord=+rvord.value,del=+rvdel.value;db.requests.push({id:Date.now(),store:rvstore.value,code:rvcode.value,name:rvname.value,ordered:ord,delivered:del,original:ord-del,remaining:ord-del,status:'DA TROVARE'});db.emails.find(e=>e.status==='NEEDS_REVIEW').status='LINKED';log('Correzione estrazione','Email 2','NEEDS_REVIEW','LINKED');save();toast('Richiesta verificata e pubblicata');go('published')}function rejectReview(){db.emails.find(e=>e.status==='NEEDS_REVIEW').status='ERROR';log('Importazione respinta','Email 2','NEEDS_REVIEW','ERROR');save();toast('Importazione respinta');go('inbox')}
function published(){if(!manager())return denied();document.getElementById('view').innerHTML=`<div class="bar"><h2>Richieste pubblicate</h2></div><div class="grid">${db.requests.map(r=>reqCard(r)).join('')}</div>`}function approve(){if(!manager())return denied();const os=db.offers.filter(o=>o.status==='DICHIARATA');document.getElementById('view').innerHTML=`<div class="bar"><h2>Offerte da approvare</h2></div><div class="panel">${os.length?os.map(o=>{let r=db.requests.find(x=>x.id===o.request);return `<div class="row"><div><strong>${o.from} → ${r.store}</strong><span class="muted">${r.name} · ${o.qty} bottiglie · residuo ${r.remaining}</span></div><div class="actions"><button class="primary" onclick="approvePrompt(${o.id})">Approva</button><button class="danger" onclick="rejectOffer(${o.id})">Rifiuta</button></div></div>`}).join(''):'<div class="empty">Nessuna offerta da approvare.</div>'}</div>`}function approvePrompt(id){const o=db.offers.find(x=>x.id===id),r=db.requests.find(x=>x.id===o.request),max=Math.min(o.qty,r.remaining);open(`<h2>Approva disponibilità</h2><p>${o.from} → ${r.store}<br>${r.name}<br>Offerta: ${o.qty} · massimo approvabile: ${max}</p><input id="aq" type="number" min="1" max="${max}" value="${max}"><div class="actions"><button class="secondary" onclick="closeModal()">Annulla</button><button class="primary" onclick="approveOffer(${id},Number(document.getElementById('aq').value))">Conferma quantità</button></div>`)}function arrivals(){if(!manager())return denied();document.getElementById('view').innerHTML=`<div class="bar"><h2>Registra arrivo a Trasta</h2></div><div class="panel form"><label>Richiesta<select id="arreq">${db.requests.filter(r=>r.remaining>0).map(r=>`<option value="${r.id}">${r.store} · ${r.code}</option>`).join('')}</select></label><label>Quantità arrivata<input id="arqty" type="number" min="1" value="4"></label><label>Data<input id="ardate" type="date" value="2026-07-14"></label><label>Fonte<select id="arsource"><option>inserimento responsabile</option><option>email</option><option>importazione file</option><option>WBOS simulato</option></select></label><button class="primary" onclick="addArrival()">Registra arrivo</button></div>`}function conflicts(){if(!manager())return denied();const t=db.transfers.find(t=>t.request===1&&t.status!=='ANNULLATA');document.getElementById('view').innerHTML=`<div class="notice"><b>È stato registrato un arrivo a Trasta, ma esiste già un trasferimento approvato.</b><br>Verifica se confermare, ridurre o annullare il trasferimento.</div><div class="panel"><div class="row"><div><strong>${t?.from||'5 – Cantore'} → 7 – De Ferrari</strong><span class="muted">2 bottiglie · ${t?.status||'IN TRASFERIMENTO'}</span></div><div class="actions"><button class="primary" onclick="resolveConflict('Confermato')">Conferma trasferimento</button><button class="secondary" onclick="resolveConflict('Ridotto')">Riduci</button><button class="danger" onclick="resolveConflict('Annullato')">Annulla</button><button class="secondary" onclick="resolveConflict('Entrambi')">Lascia entrambi</button></div></div></div>`}function audit(){if(!manager())return denied();document.getElementById('view').innerHTML=`<div class="bar"><h2>Audit log</h2></div><div class="panel audit">${db.audit.map(a=>`<div><b>${a.action}</b><br>${a.user} · ${a.store} · ${a.item}<br><span class="muted">${a.old||'—'} → ${a.next||'—'} ${a.note||''}</span></div>`).join('')}</div><button class="danger" onclick="resetDemo()">Ripristina dati demo</button>`}function denied(){document.getElementById('view').innerHTML='<div class="empty">Questa sezione è disponibile solo al responsabile centrale.</div>'}

async function initAuth() {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session) {
    await loadSession(session);
  } else {
    document.getElementById('login-screen').style.display = 'flex';
  }
}

async function loadSession(session) {
  const { data: member, error } = await supabaseClient
    .from('rete_memberships')
    .select('role, rete_locations(name, active)')
    .eq('user_id', session.user.id)
    .single();

  // rete_locations RLS grants read access to any active member, regardless of
  // the location's own `active` flag - it does not filter inactive locations
  // out of this embedded join. Location validity must therefore be checked
  // here, client-side, in addition to the role check.
  const location = member && member.rete_locations;
  const isValidCentral = member && member.role === 'central' && !location;
  const isValidStore = member && member.role === 'store' && location && location.active === true;

  if (error || !member || !(isValidCentral || isValidStore)) {
    RoleAuthority.reset();
    toast('Errore: Profilo non trovato.');
    await supabaseClient.auth.signOut();
    document.getElementById('login-screen').style.display = 'flex';
    return;
  }

  RoleAuthority.applyMembership(member.role);
  if (member.role === 'central') {
    role = 'Responsabile centrale';
  } else {
    const locName = member.rete_locations.name;
    const match = stores.find(s => s.includes(locName));
    role = match || locName;
  }

  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('main-app').classList.remove('hidden');
  
  page = manager() ? 'dashboard' : 'home';
  boot();
}

        await loadSession(data.session);
      }
    };
  }
});

  open('<h2>Profilo</h2><p>Utente autenticato come <b>'+esc(role)+'</b>.</p><div class="actions"><button class="secondary" onclick="closeModal()">Annulla</button><button class="danger" onclick="supabaseClient.auth.signOut().then(()=>location.reload())">Disconnetti</button></div>');
};
  function esc(value){return String(value==null?'':value).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function locationId(){return profileMap[role]||null}
  function locationLabel(id){var l=model.getLocation(id);return l?(l.type==='WAREHOUSE'?l.name+' · MAGAZZINO':l.name):'—'}
  function statusLabel(s){return {'DA_TROVARE':'Da trovare','DA_CONFERMARE':'Da confermare','DA_PREPARARE':'Da preparare','IN_TRASFERIMENTO':'In trasferimento','RICEVUTA':'Ricevuta','CHIUSA':'Chiusa','ANNULLATA':'Annullata'}[s]||s}
  function renderShortages(){var id=locationId(),l=id&&model.getLocation(id), rows=db.shortageRequests.map(function(r){var label=esc(model.formatPriorityLabel(r.priority));var printable=model.canPrintTransferLabel(r);return '<article class="card"><div class="cardtop"><span class="pill">'+esc(statusLabel(r.status))+'</span><span>'+esc(r.request_number||r.request_id)+'</span></div><h3>'+esc(r.product_description)+'</h3><p><b>'+esc(r.requester_location_label)+'</b> · '+esc(r.requested_quantity||r.quantity)+' bottiglie<br>Motivo: '+esc(model.reasons[r.reason])+' · Codice: '+esc(r.product_code)+' · Priorità: '+label+'</p>'+(r.comment?'<p>'+esc(r.comment)+'</p>':'')+'<div class="actions"><button class="secondary" onclick="printShortage(\''+esc(r.request_number||r.request_id)+'\')">Stampa scheda</button><button class="secondary" '+(printable?'':'disabled')+' onclick="printTransferLabel(\''+esc(r.request_number||r.request_id)+'\')">Stampa etichetta trasferimento</button></div></article>'}).join('');return '<div class="public-demo-banner"><strong>DEMO LOCALE</strong><br><span>Le schede sono salvate solo in questo browser. Nessun trasferimento reale viene creato o notificato.</span></div><div class="card"><div class="cardtop"><span class="pill">IDENTITÀ E PERMESSI</span><span>'+(l?esc(l.type):'RESPONSABILE')+'</span></div><h2>Schede ammanco</h2><p>'+ (l?'Sede corrente: <b>'+esc(role)+'</b> · '+esc(locationLabel(id)):'Seleziona un profilo negozio o magazzino per creare una richiesta.')+'</p>'+(l?'<button class="primary" onclick="openShortageForm()">＋ Crea scheda ammanco</button>':'')+'</div><div class="stack">'+(rows||'<p>Nessuna scheda ammanco demo.</p>')+'</div>'}
  window.openShortageForm=function(){var id=locationId(),l=id&&model.getLocation(id);if(!l)return toast('Seleziona una sede richiedente.');var options=Object.keys(model.reasons).filter(function(r){return model.canCreateShortageRequest(id,r)}).map(function(r){return '<option value="'+r+'">'+model.reasons[r]+'</option>'}).join('');open('<h2>Crea scheda ammanco</h2><p><b>'+esc(role)+'</b> · '+esc(l.type==='WAREHOUSE'?'MAGAZZINO':'NEGOZIO')+'</p><label>Codice prodotto<input id="sr-code" maxlength="40"></label><label>Descrizione prodotto<input id="sr-description" maxlength="120"></label><label>Quantità richiesta<input id="sr-qty" type="number" min="1" step="1"></label><label>Motivo<select id="sr-reason">'+options+'</select></label><label>Priorità<select id="sr-priority"><option value="NORMAL">Normale</option><option value="HIGH">Urgente</option></select></label><label>Commento opzionale<textarea id="sr-comment" maxlength="500"></textarea></label><div class="actions"><button class="secondary" onclick="closeModal()">Annulla</button><button class="primary" onclick="createShortage()">Salva scheda demo</button></div>')};
  window.createShortage=function(){var id=locationId(),l=model.getLocation(id),now=new Date().toISOString(),priority=document.getElementById('sr-priority').value,payload={requester_location_id:id,reason:document.getElementById('sr-reason').value,product_code:document.getElementById('sr-code').value,product_description:document.getElementById('sr-description').value,quantity:Number(document.getElementById('sr-qty').value),priority:priority};var check=model.validateShortageRequest(payload);if(!check.valid)return toast(check.errors[0]);var number='SR-'+Date.now(),request={id:number,request_id:number,request_number:number,requester_location_id:id,requester_location_label:role,requester_location_type:l.type,requesting_location_id:id,requesting_location_type:l.type,product_code:payload.product_code.trim(),product_description:payload.product_description.trim(),requested_quantity:payload.quantity,quantity:payload.quantity,reason:payload.reason,priority:priority,comment:document.getElementById('sr-comment').value.trim(),status:'DA_TROVARE',created_at:now,updated_at:now,supplier_location_id:null,supplier_location_label:null,supplier_location_type:null,confirmed_quantity:null,destination_location_id:id,destination_location_label:role,destination_location_type:l.type,expected_transfer_date:null};db.shortageRequests.unshift(request);save();closeModal();log('Scheda ammanco demo creata',request.request_number,'','DA_TROVARE','Nessuna notifica reale');toast('Scheda ammanco salvata in demo locale.');go('shortages')};
  function printSheet(html){var node=document.getElementById('print-sheet');if(!node){node=document.createElement('section');node.id='print-sheet';node.className='print-sheet';document.body.appendChild(node)}node.innerHTML=html;node.classList.add('active');window.print();window.setTimeout(function(){node.classList.remove('active')},1000)}
  window.printShortage=function(requestId){var r=db.shortageRequests.find(function(x){return (x.request_number||x.request_id)===requestId});if(!r)return;var v=model.buildRequestPrintViewModel(r);printSheet('<h1>Scheda ammanco demo</h1><p><b>Numero scheda:</b> '+esc(v.request_number)+'</p><p><b>Data e ora creazione:</b> '+esc(v.created_at)+'</p><p><b>Data e ora ultimo aggiornamento:</b> '+esc(v.updated_at)+'</p><p><b>Tipo sede:</b> '+esc(v.requesting_location_type)+'</p><p><b>Sede richiedente:</b> '+esc(v.requesting_location)+'</p><p><b>Codice articolo:</b> '+esc(v.product_code)+'</p><p><b>Descrizione articolo:</b> '+esc(v.product_description)+'</p><p><b>Quantità richiesta:</b> '+esc(v.requested_quantity)+'</p><p><b>Motivazione:</b> '+esc(v.reason)+'</p><p><b>Commento:</b> '+esc(v.comment)+'</p><p><b>Priorità:</b> '+esc(v.priority)+'</p><p><b>Stato:</b> '+esc(v.status)+'</p><p><b>Sede fornitrice:</b> '+esc(v.supplier_location)+'</p><p><b>Quantità confermata:</b> '+esc(v.confirmed_quantity)+'</p><p><b>Data prevista trasferimento:</b> '+esc(v.expected_transfer_date)+'</p><p><small>DEMO LOCALE · Nessuna operazione reale</small></p>')};
  window.printTransferLabel=function(requestId){var r=db.shortageRequests.find(function(x){return (x.request_number||x.request_id)===requestId});if(!r||!model.canPrintTransferLabel(r))return toast('Etichetta disponibile dopo conferma di sede fornitrice, quantità e destinazione.');var v=model.buildTransferLabelViewModel(r);printSheet('<h1>Etichetta trasferimento demo</h1><p><b>Numero scheda:</b> '+esc(v.request_number)+'</p><p><b>Sede mittente:</b> '+esc(v.sender)+' · '+esc(v.sender_type)+'</p><p><b>Sede destinataria:</b> '+esc(v.destination)+' · '+esc(v.destination_type)+'</p><p><b>Codice articolo:</b> '+esc(v.product_code)+'</p><p><b>Descrizione articolo:</b> '+esc(v.product_description)+'</p><p><b>Quantità confermata:</b> '+esc(v.confirmed_quantity)+'</p><p><b>Motivazione:</b> '+esc(v.reason)+'</p><p><b>Priorità:</b> '+esc(v.priority)+'</p><p><b>Data prevista trasferimento:</b> '+esc(v.expected_transfer_date)+'</p>')};
  document.addEventListener('DOMContentLoaded',function(){var banner=document.querySelector('.public-demo-banner span');if(banner)banner.textContent='Le schede sono salvate solo in questo browser. Nessun trasferimento reale viene creato o notificato.';});
})();
</script><script>
// Governed backend wiring layer. Explicit mode selection only: this block
// NEVER falls back from GOVERNED_BACKEND to the local demo write path.
// Mode is decided once per session, from the caller's own pilot_enabled
// value (RLS-restricted to the caller's own membership row), and stays
// fixed for the lifetime of the session.
(function () {
  'use strict';
  // If the adapter script failed to load (network issue, unexpected serving
  // path, etc.) this layer must degrade to a no-op rather than throw an
  // uncaught error - the existing demo-local session already rendered by
  // loadSession()/boot() before this script ran keeps working unmodified.
  if (!window.RETE_BACKEND_ADAPTER) { return; }
  var adapter = window.RETE_BACKEND_ADAPTER.create(supabaseClient);
  var GOVERNED_ONLY_MGR_PAGES = ['dashboard', 'published', 'approve', 'arrivals'];
  var GOVERNED_ONLY_STORE_PAGES = ['home', 'mine', 'offers', 'prepare', 'transfers'];

  function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  function setBanner(mode) {
    var main = document.querySelector('.main');
    if (!main) return;
    var old = main.querySelector('.governed-banner');
    if (old) old.remove();
    if (mode === adapter.MODE.GOVERNED_BACKEND) {
      // The pre-existing "PROTOTIPO DIMOSTRATIVO" banner (injected
      // unconditionally by the earlier remediation layer, for every session
      // regardless of mode) explicitly claims "i dati inseriti restano
      // esclusivamente in questo browser" / "non utilizzare per trasferimenti
      // reali di merce" - both false for a governed session, where mutations
      // create real rows via RPCs. It must be hidden here, not just have a
      // governed banner added alongside it.
      var demoBanners = main.querySelectorAll('.public-demo-banner');
      for (var i = 0; i < demoBanners.length; i++) { demoBanners[i].remove(); }
      var b = document.createElement('div');
      b.className = 'governed-banner';
      b.innerHTML = '<strong>BACKEND GOVERNATO — PILOTA ATTIVO</strong><br>Le operazioni chiamano le funzioni Supabase reali (rete_*). Nessuna scrittura locale.';
      main.prepend(b);
    }
    // In DEMO_LOCAL mode the pre-existing "PROTOTIPO DIMOSTRATIVO" banner is
    // accurate as-is and is left untouched.
  }

  async function refreshFromBackend() {
    try {
      db = await adapter.loadDashboard();
    } catch (e) {
      console.error('[rete-backend-adapter] loadDashboard failed', e);
      toast(e.message || 'Impossibile caricare i dati dal backend governato.');
      db = { requests: [], offers: [], transfers: [], emails: [], audit: [] };
    }
    boot();
  }

  function pruneNav(list, allowed) {
    for (var i = list.length - 1; i >= 0; i--) { if (allowed.indexOf(list[i][0]) === -1) list.splice(i, 1); }
  }

  function installGovernedActionOverrides() {
    window.save = function () { /* backend is the source of truth in governed mode; no local persistence */ };

    window.saveOffer = async function (id) {
      var q = Number(document.getElementById('oq').value);
      if (!Number.isInteger(q) || q < 1) return toast('Inserisci una quantità intera maggiore di zero.');
      try {
        await adapter.createOffer({ requestLocalId: id, quantity: q });
        closeModal(); toast('Disponibilità inviata.'); await refreshFromBackend(); go('home');
      } catch (e) { toast(e.message); console.error(e); }
    };

    window.withdrawOffer = async function (id) {
      try {
        await adapter.withdrawOffer({ offerLocalId: id });
        toast('Offerta ritirata.'); await refreshFromBackend(); go('offers');
      } catch (e) { toast(e.message); console.error(e); }
    };

    window.approveOffer = async function (id, requested) {
      try {
        await adapter.approveOffer({ offerLocalId: id, approvedQuantity: requested });
        closeModal(); toast('Disponibilità approvata.'); await refreshFromBackend(); go('approve');
      } catch (e) { toast(e.message); console.error(e); }
    };

    window.rejectOffer = async function (id) {
      try {
        await adapter.rejectOffer({ offerLocalId: id });
        toast('Offerta rifiutata.'); await refreshFromBackend(); go('approve');
      } catch (e) { toast(e.message); console.error(e); }
    };

    window.setTransfer = async function (id, status) {
      try {
        if (status === 'PREPARATA') await adapter.markTransferReady({ transferLocalId: id });
        else if (status === 'IN TRASFERIMENTO') await adapter.markTransferDeparted({ transferLocalId: id });
        else return toast('Transizione non supportata dal backend governato.');
        toast('Stato trasferimento aggiornato.'); await refreshFromBackend(); go(page);
      } catch (e) { toast(e.message); console.error(e); }
    };

    window.saveReceive = async function (id) {
      var q = Number(document.getElementById('rq').value);
      var t = db.transfers.find(function (x) { return x.id === id; });
      if (!t || !Number.isInteger(q) || q < 0 || q > t.qty) return toast('Quantità non valida: deve essere tra 0 e ' + (t ? t.qty : '?') + '.');
      try {
        await adapter.receiveTransfer({ transferLocalId: id, receivedQuantity: q });
        closeModal(); toast('Ricezione registrata.'); await refreshFromBackend(); go('transfers');
      } catch (e) { toast(e.message); console.error(e); }
    };

    // Request withdrawal (Ritira richiesta) has no governed RPC (rete_request_publish
    // has no corresponding cancel/withdraw counterpart among the 9 governed
    // RPCs). Rather than silently write to a local/demo path, the action is
    // disabled outright in governed mode.
    window.withdrawReq = function () { toast('Ritiro richiesta non disponibile nel backend governato (nessuna funzione dedicata).'); };

    window.addArrival = async function () {
      var reqLocalId = Number(document.getElementById('arreq').value);
      var q = Number(document.getElementById('arqty').value);
      var source = document.getElementById('arsource').value;
      var req = db.requests.find(function (x) { return x.id === reqLocalId; });
      if (!Number.isInteger(q) || q < 1) return toast('Inserisci una quantità valida.');
      if (!req) return toast('Richiesta non trovata.');
      try {
        await adapter.recordTrastaArrival({ targetRequestLocalId: reqLocalId, productCode: req.code, quantity: q, sourceReference: source });
        toast('Arrivo registrato.'); await refreshFromBackend(); go('arrivals');
      } catch (e) { toast(e.message); console.error(e); }
    };

    // New governed-only entry point for rete_request_publish (central only).
    // The demo's original "email review -> publish" flow has no backend
    // equivalent (no email ingestion RPC exists) and is hidden in governed
    // mode; this replaces it with a direct publish form.
    window.openPublishRequestForm = function () {
      var locs = adapter.getLocations().filter(function (l) { return l.active; });
      var options = locs.map(function (l) { return '<option value="' + l.id + '">' + esc(l.label) + '</option>'; }).join('');
      open('<h2>Nuova richiesta</h2><div class="form">' +
        '<label>Negozio richiedente<select id="pr-loc">' + options + '</select></label>' +
        '<label>Codice prodotto<input id="pr-code" maxlength="64"></label>' +
        '<label>Descrizione<input id="pr-desc" maxlength="240"></label>' +
        '<label>Quantità<input id="pr-qty" type="number" min="1" step="1" value="1"></label>' +
        '<label>Urgenza<select id="pr-urgency"><option value="NORMALE">Normale</option><option value="ALTA">Alta</option><option value="BASSA">Bassa</option></select></label>' +
        '<label>Note<input id="pr-notes" maxlength="500"></label>' +
        '<div class="actions"><button class="secondary" onclick="closeModal()">Annulla</button><button class="primary" onclick="submitPublishRequest()">Pubblica</button></div></div>');
    };
    window.submitPublishRequest = async function () {
      var locationId = Number(document.getElementById('pr-loc').value);
      var code = document.getElementById('pr-code').value.trim();
      var desc = document.getElementById('pr-desc').value.trim();
      var qty = Number(document.getElementById('pr-qty').value);
      var urgency = document.getElementById('pr-urgency').value;
      var notes = document.getElementById('pr-notes').value.trim();
      if (!code || !desc) return toast('Codice e descrizione sono obbligatori.');
      if (!Number.isInteger(qty) || qty < 1) return toast('Quantità non valida.');
      try {
        await adapter.publishRequest({ locationId: locationId, productCode: code, productDescription: desc, quantity: qty, urgency: urgency, notes: notes || null });
        closeModal(); toast('Richiesta pubblicata.'); await refreshFromBackend(); go('published');
      } catch (e) { toast(e.message); console.error(e); }
    };
  }

  function installGovernedPublishedPageButton() {
    var originalPublished = window.published;
    window.published = function () {
      originalPublished();
      var bar = document.querySelector('.bar');
      if (bar && !document.getElementById('pr-new-btn')) {
        var b = document.createElement('button');
        b.id = 'pr-new-btn'; b.className = 'primary'; b.textContent = '+ Nuova richiesta';
        b.onclick = function () { openPublishRequestForm(); };
        bar.appendChild(b);
      }
    };
  }

  async function applyGovernedMode(actor) {
    setBanner(actor.mode);
    if (actor.mode !== adapter.MODE.GOVERNED_BACKEND) return; // DEMO_LOCAL: leave the existing local-demo path fully untouched.
    pruneNav(mgrNav, GOVERNED_ONLY_MGR_PAGES);
    pruneNav(storeNav, GOVERNED_ONLY_STORE_PAGES);
    installGovernedActionOverrides();
    installGovernedPublishedPageButton();
    await refreshFromBackend();
  }

  var originalLoadSession = window.loadSession;
  window.loadSession = async function (session) {
    await originalLoadSession(session);
    var mainVisible = !document.getElementById('main-app').classList.contains('hidden');
    if (!mainVisible) return; // original auth/membership validation failed or signed out; nothing to wire.
    try {
      var actor = await adapter.initialize(session);
      await applyGovernedMode(actor);
    } catch (e) {
      // Adapter-level mode determination failed. This does NOT downgrade an
      // already-active governed session (mode is only ever applied forward,
      // never reversed mid-session) - it means governed mode was never
      // entered for this session, which already rendered in demo mode.
      console.error('[rete-backend-adapter] initialize failed', e);
    }
  };

  // picker()'s "Disconnetti" button already signs out directly and then
  // reloads the page. That reload already discards all adapter in-memory
  // state (actor, location cache, idempotency slots), so no additional
  // sign-out wiring is required here. adapter.signOut() remains available
  // as part of the required interface for any caller that needs to clear
  // adapter state without a page reload.
})();
</script></body></html>
